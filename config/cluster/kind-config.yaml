kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# Nom unique, commun à tous les labs Kubernetes : une machine n'héberge
# qu'un seul cluster, et cluster-create.sh supprime le précédent.
name: cluster
nodes:
  - role: control-plane
    extraPortMappings:
      # Port 80 du nœud, publié sur la machine en 8080 : c'est par là
      # qu'entre le trafic du navigateur vers la Gateway API.
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
  - role: worker
  - role: worker
  - role: worker
