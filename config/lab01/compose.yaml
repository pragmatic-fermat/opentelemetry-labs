name: lab01

# Services des labs 1A, 1B et 1C, sur clt-N.
#
# L'application (shop et inventory) tourne dans tous les labs. Le collector
# n'est démarré qu'à partir de 1B (profil otelcol), et les sondes de santé
# qu'à partir de 1C (profil health) : elles produisent le bruit que la
# partie 1C retire.
#
# Les variables d'environnement des conteneurs sont lues dans le fichier .env
# du dossier : vide en 1A (les spans sortent sur la console), renseigné en 1B
# et 1C (les spans partent vers le collector).

x-app: &app
  build: ./app
  image: lab01-app:local
  environment:
    # Vide en 1A : telemetry.py écrit alors les spans sur la console.
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    INVENTORY_URL: http://inventory:8081
  volumes:
    # Le code est monté depuis le dossier app/ : une modification ne demande
    # pas de reconstruire l'image, docker compose restart shop inventory suffit.
    - ./app:/app:ro
  restart: unless-stopped

services:
  shop:
    <<: *app
    command: ["python", "shop.py"]
    ports:
      - "8080:8080"
    depends_on:
      - inventory

  inventory:
    <<: *app
    command: ["python", "inventory.py"]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      INVENTORY_URL: http://inventory:8081
      # Mode lent, activé à la main : millisecondes de sommeil par requête.
      INVENTORY_DELAY_MS: ${INVENTORY_DELAY_MS:-0}
    volumes:
      - ./app:/app:ro
    restart: unless-stopped

  # Collector de 1B et 1C : profil otelcol.
  otelcol:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.165.0
    profiles: ["otelcol"]
    command:
      - --config=/etc/otelcol/receivers.yaml
      - --config=/etc/otelcol/processors.yaml
      - --config=/etc/otelcol/exporters.yaml
      - --config=/etc/otelcol/service.yaml
    environment:
      LAB_ID: ${LAB_ID:-0}
    volumes:
      - ./otelcol:/etc/otelcol:ro
    ports:
      - "4318:4318"
    restart: "no"

  # Sondes de santé de 1C : profil health. Elles appellent /health toutes les
  # cinq secondes, ce qui remplit Jaeger de spans de bruit.
  probe:
    image: curlimages/curl:8.11.0
    profiles: ["health"]
    command:
      - sh
      - -c
      - 'while true; do curl -s -o /dev/null http://shop:8080/health; sleep 5; done'
    depends_on:
      - shop
    restart: unless-stopped

  # Générateur de télémétrie, utilisé via ./tg.sh
  telemetrygen:
    image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.165.0
    profiles: ["tools"]
