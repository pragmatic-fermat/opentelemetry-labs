services:
  shop:
    build: app
    command: ["python", "shop.py"]
    ports:
      - "8080:8080"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otelcol:4318
      - INVENTORY_URL=http://inventory:8081
    volumes:
      - ./app:/app
    depends_on:
      - otelcol

  inventory:
    build: app
    command: ["python", "inventory.py"]
    ports:
      - "8081:8081"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otelcol:4318
    volumes:
      - ./app:/app
    depends_on:
      - otelcol

  otelcol:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otelcol:/etc/otelcol:ro
    ports:
      - "4318:4318"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports:
      - "16686:16686"
    restart: unless-stopped
