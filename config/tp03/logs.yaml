# Backend de logs du TP3 : VictoriaLogs, en un seul conteneur, avec son interface web.
# Le collector y envoie le pipeline logs en OTLP/HTTP (protobuf) sur
# /insert/opentelemetry/v1/logs ; l'interface de requete est servie sur /select/vmui/.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-logs
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoria-logs
  template:
    metadata:
      labels:
        app: victoria-logs
    spec:
      containers:
        - name: victoria-logs
          image: victoriametrics/victoria-logs:v1.54.0
          args:
            - -storageDataPath=/vlogs
            - -retentionPeriod=1d
          ports:
            - containerPort: 9428
              name: http
          volumeMounts:
            - name: data
              mountPath: /vlogs
          resources:
            limits:
              cpu: 300m
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
  namespace: observability
spec:
  selector:
    app: victoria-logs
  ports:
    - port: 9428
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoria-logs
  namespace: observability
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "vlogs.INGRESS_HOST"
  rules:
    - backendRefs:
        - name: victoria-logs
          port: 9428
