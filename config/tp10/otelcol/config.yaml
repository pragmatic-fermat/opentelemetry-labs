# Collector du TP10, fourni au participant : c'est lui que le TP supervise.
# Il reçoit en OTLP/HTTP, exporte en debug, et publie ses métriques internes
# sur le port 8888, que Prometheus interroge (voir ../prometheus/prometheus.yml).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  batch:

exporters:
  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
