#cloud-config
# Machine clt-N : machine cliente des labs OpenTelemetry.
# Ubuntu 24.04, Docker et Compose v2, Ansible, outils Kubernetes clients
# (kubectl, helm, kind), terminal web (ttyd derriere Caddy).
#
# Versions epinglees et verifiees le 2026-11-19 (voir README.md).
package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - curl
  - git
  - gnupg
  - jq
  - python3
  - unzip
  - ansible
users:
  # Le terminal web ouvre des sessions directement en root (machines
  # ephemeres) : aucun autre compte n'est necessaire.
  - name: root
    lock-passwd: false
    plain_text_passwd: "${root_password}"
ssh_pwauth: true
write_files:
  # Terminal web : ttyd ecoute en local, Caddy le publie en HTTPS sur
  # https://${clt_machine}.${lab_domain} (certificat Let's Encrypt automatique).
  # ttyd sert un simple shell dans le navigateur (avec copier/coller),
  # protege par le mot de passe statique de la variable TFC webshell_password.
  # Service systemd du terminal web : sessions ouvertes directement en root,
  # authentification basic auth (mot de passe de la variable TFC).
  # ttyd ecoute sur 127.0.0.1:7681, et non sur le port 8080 : celui-ci est
  # reserve au port publie du cluster KinD des labs Kubernetes.
  - content: |
      [Unit]
      Description=Terminal web des labs (ttyd)
      After=network.target

      [Service]
      User=root
      WorkingDirectory=/root
      ExecStart=/usr/local/bin/ttyd -W -i 127.0.0.1 -p 7681 -c "stagiaire:${webshell_password}" bash
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
    path: /etc/systemd/system/ttyd.service
  # Limites inotify : chaque noeud KinD, et chaque kubelet, consomme des
  # instances inotify. Les valeurs par defaut (128 instances) saturent des
  # qu'un second cluster demarre, et systemd echoue alors avec "Too many
  # open files". Valeurs appliquees au demarrage par sysctl --system.
  - content: |
      fs.inotify.max_user_instances = 512
      fs.inotify.max_user_watches = 524288
    path: /etc/sysctl.d/90-inotify.conf
  # Cle SSH dediee aux machines du lab (non personnelle, ephemere).
  # Permet a clt-N et srv-N de se joindre mutuellement sans mot de passe,
  # ainsi qu'aux machines ephemeres du lab 4 (srv2, srv3).
  - content: |
      -----BEGIN OPENSSH PRIVATE KEY-----
      b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
      QyNTUxOQAAACAtscZ0UBIa27E0+idVtm3WoeBnHMGRN3eXdZmmdp/rtwAAAKjz4n0l8+J9
      JQAAAAtzc2gtZWQyNTUxOQAAACAtscZ0UBIa27E0+idVtm3WoeBnHMGRN3eXdZmmdp/rtw
      AAAECH5Th5XrgV+WsLz37DFYtE1DkQKCCNA6AcQfRdE2rKGi2xxnRQEhrbsTT6J1W2bdah
      4GccwZE3d5d1maZ2n+u3AAAAJGxhYi1pbnRlci12bUBvcGVudGVsZW1ldHJ5LWZvcm1hdG
      lvbgE=
      -----END OPENSSH PRIVATE KEY-----
    path: /root/.ssh/id_ed25519
    permissions: "0600"
  - content: |
      ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC2xxnRQEhrbsTT6J1W2bdah4GccwZE3d5d1maZ2n+u3 lab-inter-vm@opentelemetry-lab
    path: /root/.ssh/id_ed25519.pub
    permissions: "0644"
  # Variables d'environnement des labs, disponibles dans tous les terminaux.
  - content: |
      export LAB_ID="${lab_id}"
      export LAB_DOMAIN="${lab_domain}"
      export CLT_HOST="${clt_machine}.${lab_domain}"
      export SRV_HOST="${srv_machine}.${lab_domain}"
    path: /etc/profile.d/lab-env.sh
  - content: |
      [ -f /etc/profile.d/lab-env.sh ] && . /etc/profile.d/lab-env.sh
    path: /etc/bash.bashrc
    append: true
  # Clone du depot des labs. Le depot est public, le clone s'effectue en
  # HTTPS anonyme.
  - content: |
      #!/bin/bash
      set -eu
      rm -rf /root/opentelemetry-labs
      git clone https://github.com/pragmatic-fermat/opentelemetry-labs.git /root/opentelemetry-labs
    path: /usr/local/sbin/lab-clone.sh
    permissions: "0700"
runcmd:
  # Acces SSH root par mot de passe (maintenance d'urgence). Le compte
  # stagiaire n'a pas de mot de passe et se connecte par cle.
  - ufw disable
  # Applique les limites inotify sans attendre le prochain demarrage.
  - sysctl --system
  - sed -i -E 's/^#?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
  - sed -i -E 's/^#?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
  - grep -q '^PermitRootLogin yes' /etc/ssh/sshd_config || echo 'PermitRootLogin yes' >> /etc/ssh/sshd_config
  - grep -q '^PasswordAuthentication yes' /etc/ssh/sshd_config || echo 'PasswordAuthentication yes' >> /etc/ssh/sshd_config
  - systemctl restart ssh
  # Autorise la cle SSH inter-machines du lab.
  - grep -q 'lab-inter-vm@opentelemetry-lab' /root/.ssh/authorized_keys 2>/dev/null || echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIC2xxnRQEhrbsTT6J1W2bdah4GccwZE3d5d1maZ2n+u3 lab-inter-vm@opentelemetry-lab' >> /root/.ssh/authorized_keys
  - chmod 600 /root/.ssh/authorized_keys
  # Swap 2G, utile pour le cluster KinD des labs suivants (idempotent).
  - swapoff /swapfile 2>/dev/null || true
  - rm -f /swapfile
  - fallocate -l 2G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - grep -q '^/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
  # Docker Engine et Compose v2 depuis le depot officiel Docker.
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  # Caddy depuis le depot officiel. Le fichier de depot Cloudsmith reference
  # la cle au format binaire .gpg : il faut deblinder la cle telechargee.
  # Le Caddyfile est ecrit apres l'installation du paquet : ecrit avant, il
  # entre en conflit avec le fichier livre par le paquet (echec de dpkg).
  - curl -fsSL https://dl.cloudsmith.io/public/caddy/stable/gpg.key | gpg --dearmor --yes -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -fsSL https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt -o /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y caddy
  - |
    cat > /etc/caddy/Caddyfile <<'EOF'
    {
      email webmaster@${lab_domain}
    }

    https://${clt_machine}.${lab_domain} {
      reverse_proxy 127.0.0.1:7681
    }
    EOF
  - systemctl reload caddy || systemctl restart caddy
  # Terminal web ttyd (shell dans le navigateur), binaire epingle.
  - curl -fsSL https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -o /usr/local/bin/ttyd
  - chmod +x /usr/local/bin/ttyd
  - systemctl enable --now ttyd
  # Outils Kubernetes clients, binaires epingles.
  - curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.54.3/yq_linux_amd64 -o /usr/local/bin/yq
  - chmod +x /usr/local/bin/yq
  - curl -fsSL https://dl.k8s.io/release/v1.37.2/bin/linux/amd64/kubectl -o /usr/local/bin/kubectl
  - chmod +x /usr/local/bin/kubectl
  - curl -fsSL https://get.helm.sh/helm-v4.3.2-linux-amd64.tar.gz -o /tmp/helm.tgz
  - tar -xzf /tmp/helm.tgz -C /tmp
  - install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
  - curl -fsSL https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 -o /usr/local/bin/kind
  - chmod +x /usr/local/bin/kind
  # Clone du depot des labs dans /root (script ci-dessus).
  - bash /usr/local/sbin/lab-clone.sh
